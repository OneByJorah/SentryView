services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rtsp-nvr-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    environment:
      - REACT_APP_API_URL=${BACKEND_URL:-http://backend:5000}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - rtsp-nvr-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rtsp-nvr-backend
    ports:
      - "5011:5000"
    environment:
      - DATABASE_URL=postgresql://admin:***@shared-postgres:5432/rtsp_nvr
      - REDIS_URL=redis://shared-redis:6379
      - SECRET_KEY=${SECRET_KEY:-change-this-to-a-random-secret}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-this-jwt-secret}
      - TAILSCALE_API_KEY=${TAILSCALE_API_KEY:-}
      - TAILSCALE_TAILNET_ID=${TAILSCALE_TAILNET_ID:-}
      - WEBSOCKET_ENABLED=true
      - LOG_LEVEL=INFO
    networks:
      - rtsp-nvr-network
      - shared-infrastructure_default
    restart: unless-stopped
    volumes:
      - backend-logs:/var/log/rtsp-nvr/backend
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  ffmpeg:
    build:
      context: ./ffmpeg
      dockerfile: Dockerfile
    container_name: rtsp-nvr-ffmpeg
    environment:
      - INPUT_URL=${RTSP_URL:-rtsp://example.com/stream}
      - OUTPUT_PATH=/output
      - BACKEND_URL=http://backend:5000
    volumes:
      - rtsp-nvr-ffmpeg:/output:rw
    networks:
      - rtsp-nvr-network
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f ffmpeg || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  backup:
    image: postgres:15-alpine
    container_name: rtsp-nvr-backup
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "0 2 * * * PGPASSWORD='${POSTGRES_PASSWORD:-secure_password_change_me}' pg_dump -h shared-postgres -U admin -Fc rtsp_nvr > /backups/backup_\$(date +%Y%m%d_%H%M%S).dump 2>> /backups/backup.log" | crontab -
        crond -f -l 2
    environment:
      - PGPASSWORD=${POSTGRES_PASSWORD:-secure_password_change_me}
      - POSTGRES_USER=admin
      - POSTGRES_DB=rtsp_nvr
    volumes:
      - rtsp-nvr-backup:/backups
    networks:
      - rtsp-nvr-network
      - shared-infrastructure_default
    restart: unless-stopped

networks:
  rtsp-nvr-network:
    driver: bridge
    name: rtsp-nvr-network
  shared-infrastructure_default:
    external: true

volumes:
  rtsp-nvr-ffmpeg:
    name: rtsp-nvr-ffmpeg
  rtsp-nvr-backup:
    name: rtsp-nvr-backup
  backend-logs:
    name: rtsp-nvr-backend-logs
